services:
  mongo1:
    hostname: mongo1
    image: mongo
    expose:
      - 27017
    ports:
      - 30001:27017
    restart: always
    healthcheck:
      test: echo 'db.runCommand("ping").ok' | mongosh localhost:27017/test --quiet
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    command: >
      mongod --replSet my-mongo-set --bind_ip_all
    networks:
      - mongors-network
  mongo2:
    hostname: mongo2
    image: mongo
    expose:
      - 27017
    ports:
      - 30002:27017
    restart: always
    healthcheck:
      test: echo 'db.runCommand("ping").ok' | mongosh localhost:27017/test --quiet
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    command: mongod --replSet my-mongo-set --bind_ip_all
    networks:
      - mongors-network
  mongo3:
    hostname: mongo3
    image: mongo
    expose:
      - 27017
    ports:
      - 30003:27017
    restart: always
    healthcheck:
      test: echo 'db.runCommand("ping").ok' | mongosh localhost:27017/test --quiet
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    command: mongod --replSet my-mongo-set --bind_ip_all
    networks:
      - mongors-network


  mongoinit:
    image: mongo
    restart: "no"
    depends_on:
      mongo1:
        condition: service_healthy
      mongo2:
        condition: service_healthy
      mongo3:
        condition: service_healthy
    command: tail -F anything
    networks:
      - mongors-network

networks:
  mongors-network:
    driver: bridge

#mongosh --host mongo1:27017 --eval 'db = (new Mongo("localhost:27017")).getDB("test");config = {"_id" : "my-mongo-set","members" : [{"_id" : 0,"host" : "mongo1:27017"},{"_id" : 1,"host" : "mongo2:27017"},{"_id" : 2,"host" : "mongo3:27017"}]};rs.initiate(config);'


